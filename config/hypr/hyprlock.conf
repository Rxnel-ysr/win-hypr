# ~/.config/hypr/hyprlock.conf – Windows 11 lock / sign-in screen (hyprlock still uses hyprlang)
general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    brightness = 0.65
}

# Big time + date, top-centre like the Windows lock screen
label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M"
    color = rgba(255, 255, 255, 1.0)
    font_size = 132
    font_family = Selawik Light
    position = 0, 280
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(255, 255, 255, 0.92)
    font_size = 26
    font_family = Selawik
    position = 0, 170
    halign = center
    valign = center
}

# Sign-in: avatar, name, password box
image {
    monitor =
    path = ~/.face
    size = 120
    rounding = -1
    border_size = 0
    position = 0, -20
    halign = center
    valign = center
}
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 1.0)
    font_size = 24
    font_family = Selawik Semibold
    position = 0, -110
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 300, 44
    outline_thickness = 2
    outer_color = rgba(255, 255, 255, 0.35)
    inner_color = rgba(0, 0, 0, 0.45)
    font_color = rgba(255, 255, 255, 1.0)
    check_color = rgba(96, 205, 255, 1.0)
    fail_color = rgba(255, 99, 97, 1.0)
    fade_on_empty = false
    rounding = 6
    placeholder_text = <span foreground="##ffffffaa">Password</span>
    fail_text = <span foreground="##ff6361">Incorrect password</span>
    dots_size = 0.25
    dots_spacing = 0.3
    position = 0, -180
    halign = center
    valign = center
}
